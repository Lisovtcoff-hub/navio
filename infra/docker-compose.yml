services:
  db:
    image: postgres:16
    container_name: navio-db
    environment:
      POSTGRES_DB: navio
      POSTGRES_USER: navio
      POSTGRES_PASSWORD: navio
    ports:
      - "5432:5432"
    volumes:
      - navio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navio -d navio"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: navio-backend
    environment:
      APP_ENV: dev
      LOG_LEVEL: INFO
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: navio
      POSTGRES_USER: navio
      POSTGRES_PASSWORD: navio
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  navio_pgdata: