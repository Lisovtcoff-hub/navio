services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: navio
      POSTGRES_USER: navio
      POSTGRES_PASSWORD: navio
    ports:
      - "5432:5432"
    volumes:
      - navio_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  navio_pgdata:
