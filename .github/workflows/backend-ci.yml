name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: navio
          POSTGRES_USER: navio
          POSTGRES_PASSWORD: navio
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U navio -d navio"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff format (check)
        working-directory: backend
        run: |
          ruff format --check .

      - name: Ruff lint
        working-directory: backend
        run: |
          ruff check .

      - name: Pytest
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: navio
          POSTGRES_USER: navio
          POSTGRES_PASSWORD: navio
          JWT_SECRET: test-secret
          LOGIN_CODE_PEPPER: test-pepper
          LOGIN_CODE_TTL_MIN: "10"
          JWT_ACCESS_TTL_MIN: "15"
        run: |
          python -m pytest -q